[site]
title = "Robotics & AI Daily Briefing"
subtitle = "New cs.RO and cs.AI papers, bucketed and summarized every arXiv announcement day"
base_url = "https://tomkimsour.github.io/mon-journal"
language = "en"
feed_max_items = 60

[arxiv]
categories = ["cs.RO", "cs.AI", "cs.CV"]

# Each new paper goes to the bucket with the most keyword hits (title hits count double).
# Keywords match whole words, case-insensitively, with an optional plural "s"/"es".
# Papers matching no bucket are dropped from the briefing. Order breaks ties.

[[buckets]]
name = "Manipulation"
emoji = "🦾"
keywords = [
  "manipulation", "grasp", "grasping", "dexterous", "bimanual", "gripper",
  "pick-and-place", "pick and place", "in-hand", "contact-rich", "tactile",
  "deformable object", "cloth folding", "robotic assembly", "peg-in-hole", "end-effector",
]

[[buckets]]
name = "Legged & Humanoid"
emoji = "🦿"
keywords = [
  "locomotion", "legged", "quadruped", "humanoid", "biped", "bipedal",
  "whole-body", "gait", "loco-manipulation", "exoskeleton",
]

[[buckets]]
name = "Navigation & SLAM"
emoji = "🧭"
keywords = [
  "navigation", "slam", "robot localization", "visual localization", "lidar localization",
  "semantic mapping", "odometry", "visual odometry", "path planning", "obstacle avoidance",
  "autonomous exploration", "frontier exploration", "occupancy map", "lidar",
  "place recognition", "social navigation", "mobile robot", "vision-and-language navigation",
]

[[buckets]]
name = "Robot Learning"
emoji = "🧠"
keywords = [
  "imitation learning", "behavior cloning", "vla", "vision-language-action",
  "robot learning", "policy learning", "diffusion policy", "sim-to-real", "sim2real",
  "learning from demonstration", "human demonstrations", "robot foundation model",
